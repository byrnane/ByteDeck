<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Menu</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="bd-builtin-shell bd-theme-shell">
    <header class="bd-builtin-header bd-theme-header">
      <div class="bd-builtin-header-left">
        <div class="bd-theme-header-brand">BYTEDECK</div>
        <div class="bd-theme-header-context">Main Menu</div>
      </div>
      <div class="bd-builtin-header-right">
        <div class="bd-theme-header-meta">20:47</div>
        <div class="bd-theme-header-meta">76%</div>
      </div>
    </header>
    <main class="bd-builtin-content">
      <div class="bd-builtin-main-menu-wrap">
        <h1 class="bd-theme-screen-title">BYTEDECK</h1>
        <p class="bd-theme-screen-subtitle">Main Menu</p>
        <div class="bd-builtin-main-menu-panel bd-theme-main-menu-panel">
          <div class="bd-builtin-main-menu-cards" id="main-menu-cards"></div>
        </div>
        <div class="bd-builtin-main-menu-pager">
          <div class="bd-builtin-main-menu-dot is-active"></div>
        </div>
      </div>
    </main>
    <footer class="bd-builtin-footer bd-theme-footer">
      <div class="bd-builtin-footer-left">
        <div class="bd-theme-footer-action">A</div>
        <div class="bd-theme-footer-action">MENU</div>
      </div>
      <div class="bd-builtin-footer-right">
        <div class="bd-theme-footer-hint">Press A</div>
      </div>
    </footer>
  </div>
  <script>
    const items = [
      { title: "Games", status: "19 items" },
      { title: "Settings", status: "Ready" },
      { title: "Apps", status: "Empty" }
    ];
    let selected = 0;
    const root = document.getElementById("main-menu-cards");

    function render() {
      root.innerHTML = "";
      items.forEach((item, index) => {
        const active = index === selected;
        const frame = document.createElement("div");
        frame.className = "bd-builtin-main-menu-card bd-theme-main-menu-card-frame" + (active ? " is-selected" : "");
        frame.innerHTML = `
          <div class="bd-builtin-main-menu-card-inner bd-theme-main-menu-card-inner ${active ? "is-selected" : ""}">
            <div class="bd-theme-main-menu-card-title">${item.title}</div>
            <div class="bd-theme-main-menu-card-info">${item.status}</div>
            <div class="bd-theme-main-menu-card-hint ${active ? "is-selected" : ""}">${active ? "Press A" : "Ready"}</div>
            <div class="bd-builtin-main-menu-card-accent bd-theme-main-menu-card-accent ${active ? "is-selected" : ""}"></div>
          </div>`;
        root.appendChild(frame);
      });
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        selected = (selected + items.length - 1) % items.length;
        render();
      } else if (event.key === "ArrowRight") {
        selected = (selected + 1) % items.length;
        render();
      }
    });

    render();
  </script>
</body>
</html>
