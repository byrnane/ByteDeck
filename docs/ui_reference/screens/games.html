<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="bd-builtin-shell bd-theme-shell">
    <header class="bd-builtin-header bd-theme-header">
      <div class="bd-builtin-header-left">
        <div class="bd-theme-header-brand">BYTEDECK</div>
        <div class="bd-theme-header-context">Games</div>
      </div>
      <div class="bd-builtin-header-right">
        <div class="bd-theme-header-meta">20:48</div>
        <div class="bd-theme-header-meta">76%</div>
      </div>
    </header>
    <main class="bd-builtin-content">
      <h1 class="bd-theme-screen-title">Games</h1>
      <p class="bd-theme-screen-subtitle">Choose a system to browse.</p>
      <div class="bd-builtin-system-grid" id="systems-grid"></div>
    </main>
    <footer class="bd-builtin-footer bd-theme-footer">
      <div class="bd-builtin-footer-left">
        <div class="bd-theme-footer-action">A</div>
        <div class="bd-theme-footer-action">B</div>
        <div class="bd-theme-footer-action">MENU</div>
      </div>
      <div class="bd-builtin-footer-right">
        <div class="bd-theme-footer-hint">Press A to open</div>
      </div>
    </footer>
  </div>
  <script>
    const systems = [
      { title: "NES", meta: "14 items", icon: "../../../themes/default/assets/icons/systems/fc.png" },
      { title: "Mega Drive", meta: "5 items", icon: "../../../themes/default/assets/icons/systems/md.png" }
    ];
    let selected = 0;
    const root = document.getElementById("systems-grid");

    function render() {
      root.innerHTML = "";
      systems.forEach((item, index) => {
        const active = index === selected;
        const frame = document.createElement("div");
        frame.className = "bd-builtin-system-card bd-theme-system-card-frame" + (active ? " is-selected" : "");
        frame.innerHTML = `
          <div class="bd-builtin-system-card-inner bd-theme-system-card-inner ${active ? "is-selected" : ""}">
            <div class="bd-builtin-system-icon"><img src="${item.icon}" alt=""></div>
            <div>
              <div class="bd-theme-system-title">${item.title}</div>
              <div class="bd-theme-system-meta">${item.meta}</div>
              <div class="bd-theme-system-hint ${active ? "is-selected" : ""}">${active ? "Press A to open" : "Ready"}</div>
            </div>
          </div>`;
        root.appendChild(frame);
      });
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        selected = (selected + systems.length - 1) % systems.length;
        render();
      } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        selected = (selected + 1) % systems.length;
        render();
      }
    });

    render();
  </script>
</body>
</html>
