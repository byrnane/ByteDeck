<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Browser</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="bd-builtin-shell bd-theme-shell">
    <header class="bd-builtin-header bd-theme-header">
      <div class="bd-builtin-header-left">
        <div class="bd-theme-header-brand">BYTEDECK</div>
        <div class="bd-theme-header-context">NES - Game Browser</div>
      </div>
      <div class="bd-builtin-header-right">
        <div class="bd-theme-header-meta">20:49</div>
        <div class="bd-theme-header-meta">76%</div>
      </div>
    </header>
    <main class="bd-builtin-content">
      <div class="bd-builtin-two-column">
        <div class="bd-builtin-panel bd-theme-panel-primary">
          <div class="bd-builtin-browser-header">
            <div class="bd-builtin-system-icon"><img src="../../../themes/default/assets/icons/systems/fc.png" alt=""></div>
            <div>
              <div class="bd-theme-screen-title" style="font-size:30px;">NES</div>
              <div class="bd-theme-screen-subtitle">Game Browser</div>
            </div>
          </div>
          <div class="bd-builtin-list" id="game-list"></div>
        </div>
        <div class="bd-builtin-panel bd-theme-panel-secondary">
          <div class="bd-theme-section-title">Preview</div>
          <div class="bd-builtin-preview-frame">
            <img src="../../../ROMS/nes/media/Adventure Island I [RUS].png" alt="">
          </div>
          <div class="bd-theme-detail-title" id="detail-title">Adventure Island I [RUS]</div>
          <div class="bd-theme-meta-line">Genre: Platform</div>
          <div class="bd-theme-meta-line">Players: 1</div>
          <div class="bd-theme-meta-line">Date: 19880902</div>
          <div class="bd-theme-meta-line">Source: gamelist</div>
          <div class="bd-theme-section-title" style="margin-top:26px;">Description</div>
          <div class="bd-theme-body-copy">Known retro platformer. This text only simulates the final proportions of the description block.</div>
        </div>
      </div>
    </main>
    <footer class="bd-builtin-footer bd-theme-footer">
      <div class="bd-builtin-footer-left">
        <div class="bd-theme-footer-action">A</div>
        <div class="bd-theme-footer-action">B</div>
        <div class="bd-theme-footer-action">MENU</div>
      </div>
      <div class="bd-builtin-footer-right">
        <div class="bd-theme-footer-hint">Press A</div>
      </div>
    </footer>
  </div>
  <script>
    const games = [
      "Adventure Island I [RUS]",
      "Adventure Island II [RUS]",
      "Alien 3 [RUS]",
      "Castlevania I [RUS]",
      "Castlevania II: Simon's Quest [RUS]",
      "Chip 'n Dale: Rescue Rangers [RUS]"
    ];
    let selected = 0;
    const root = document.getElementById("game-list");
    const detail = document.getElementById("detail-title");

    function render() {
      root.innerHTML = "";
      games.forEach((title, index) => {
        const active = index === selected;
        const node = document.createElement("div");
        node.className = "bd-builtin-list-item bd-theme-list-item-frame" + (active ? " is-selected" : "");
        node.innerHTML = `
          <div class="bd-builtin-list-item-inner bd-theme-list-item-inner ${active ? "is-selected" : ""}">
            <div class="bd-theme-list-item-text ${active ? "is-selected" : ""}">${title}</div>
          </div>`;
        root.appendChild(node);
      });
      detail.textContent = games[selected];
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        selected = (selected + games.length - 1) % games.length;
        render();
      } else if (event.key === "ArrowDown") {
        selected = (selected + 1) % games.length;
        render();
      }
    });

    render();
  </script>
</body>
</html>
