<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="bd-builtin-shell bd-theme-shell">
    <header class="bd-builtin-header bd-theme-header">
      <div class="bd-builtin-header-left">
        <div class="bd-theme-header-brand">BYTEDECK</div>
        <div class="bd-theme-header-context">Games</div>
      </div>
      <div class="bd-builtin-header-right">
        <div class="bd-theme-header-meta">20:48</div>
        <div class="bd-theme-header-meta">76%</div>
      </div>
    </header>
    <main class="bd-builtin-content">
      <h1 class="bd-theme-screen-title">Games</h1>
      <p class="bd-theme-screen-subtitle">Choose a system to browse.</p>
      <div class="bd-builtin-system-grid">
        <div class="bd-builtin-system-card bd-theme-system-card-frame is-selected">
          <div class="bd-builtin-system-card-inner bd-theme-system-card-inner is-selected">
            <div class="bd-builtin-system-icon"><img src="../../themes/default/assets/icons/systems/fc.png" alt=""></div>
            <div>
              <div class="bd-theme-system-title">NES</div>
              <div class="bd-theme-system-meta">14 items</div>
              <div class="bd-theme-system-hint is-selected">Press A to open</div>
            </div>
          </div>
        </div>
        <div class="bd-builtin-system-card bd-theme-system-card-frame">
          <div class="bd-builtin-system-card-inner bd-theme-system-card-inner">
            <div class="bd-builtin-system-icon"><img src="../../themes/default/assets/icons/systems/md.png" alt=""></div>
            <div>
              <div class="bd-theme-system-title">Mega Drive</div>
              <div class="bd-theme-system-meta">5 items</div>
              <div class="bd-theme-system-hint">Ready</div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bd-builtin-footer bd-theme-footer">
      <div class="bd-builtin-footer-left">
        <div class="bd-theme-footer-action">A</div>
        <div class="bd-theme-footer-action">B</div>
        <div class="bd-theme-footer-action">MENU</div>
      </div>
      <div class="bd-builtin-footer-right">
        <div class="bd-theme-footer-hint">Press A to open</div>
      </div>
    </footer>
  </div>
</body>
</html>
