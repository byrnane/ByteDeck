<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Menu</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="bd-builtin-shell bd-theme-shell">
    <header class="bd-builtin-header bd-theme-header">
      <div class="bd-builtin-header-left">
        <div class="bd-theme-header-brand">BYTEDECK</div>
        <div class="bd-theme-header-context">Main Menu</div>
      </div>
      <div class="bd-builtin-header-right">
        <div class="bd-theme-header-meta">20:47</div>
        <div class="bd-theme-header-meta">76%</div>
      </div>
    </header>
    <main class="bd-builtin-content">
      <div class="bd-builtin-main-menu-wrap">
        <div class="bd-builtin-main-menu-panel bd-theme-main-menu-panel">
          <div class="bd-builtin-main-menu-cards">
            <div class="bd-builtin-main-menu-card bd-theme-main-menu-card-frame is-selected">
              <div class="bd-builtin-main-menu-card-inner bd-theme-main-menu-card-inner is-selected">
                <div class="bd-theme-main-menu-card-title">Games</div>
                <div class="bd-theme-main-menu-card-info">19 items</div>
                <div class="bd-theme-main-menu-card-hint is-selected">Press A</div>
                <div class="bd-builtin-main-menu-card-accent bd-theme-main-menu-card-accent is-selected"></div>
              </div>
            </div>
            <div class="bd-builtin-main-menu-card bd-theme-main-menu-card-frame">
              <div class="bd-builtin-main-menu-card-inner bd-theme-main-menu-card-inner">
                <div class="bd-theme-main-menu-card-title">Settings</div>
                <div class="bd-theme-main-menu-card-info">Ready</div>
                <div class="bd-theme-main-menu-card-hint">Ready</div>
                <div class="bd-builtin-main-menu-card-accent bd-theme-main-menu-card-accent"></div>
              </div>
            </div>
            <div class="bd-builtin-main-menu-card bd-theme-main-menu-card-frame">
              <div class="bd-builtin-main-menu-card-inner bd-theme-main-menu-card-inner">
                <div class="bd-theme-main-menu-card-title">Apps</div>
                <div class="bd-theme-main-menu-card-info">Empty</div>
                <div class="bd-theme-main-menu-card-hint">Ready</div>
                <div class="bd-builtin-main-menu-card-accent bd-theme-main-menu-card-accent"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="bd-builtin-main-menu-pager">
          <div class="bd-builtin-main-menu-dot is-active"></div>
        </div>
      </div>
    </main>
    <footer class="bd-builtin-footer bd-theme-footer">
      <div class="bd-builtin-footer-left">
        <div class="bd-theme-footer-action">A</div>
        <div class="bd-theme-footer-action">MENU</div>
      </div>
      <div class="bd-builtin-footer-right">
        <div class="bd-theme-footer-hint">Press A</div>
      </div>
    </footer>
  </div>
</body>
</html>
